[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sr-dg-mappo"
version = "0.3.0"
description = "Symmetry-reduced, rate-limited communication primitives for DG-MAPPO"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Shahil Shaik"}]
dependencies = ["torch>=1.12", "numpy>=1.23", "gymnasium>=0.28"]
keywords = ["multi-agent reinforcement learning", "equivariance", "communication", "vector quantization"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]
marl = ["tensorboard>=2.12", "setproctitle>=1.3"]

[project.scripts]
sr-dg-mappo-demo = "sr_dg_mappo.demo:main"
sr-dg-mappo-train = "sr_dg_mappo.train:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"
